<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="starHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#fed7aa" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Ambient soft glow halo -->
  <circle cx="32" cy="32" r="26" fill="url(#starHalo)" />
  
  <!-- 4-point star core -->
  <path d="M32 2 
           C32 18 36 28 46 32 
           C36 36 32 46 32 62 
           C32 46 28 36 18 32 
           C28 28 32 18 32 2 Z" 
        fill="#ffffff" />
        
  <!-- Center radiant pinpoint -->
  <circle cx="32" cy="32" r="3.5" fill="#fef9c3" />
</svg>
