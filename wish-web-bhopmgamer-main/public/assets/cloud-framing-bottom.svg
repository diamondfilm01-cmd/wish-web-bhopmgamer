<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 280" fill="none" preserveAspectRatio="none">
  <defs>
    <!-- Soft volumetric blur filter -->
    <filter id="bottomCloudBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Deep cloud bank foundation (lilac & violet) -->
    <linearGradient id="deepCloudBank" x1="720" y1="280" x2="720" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#a855f7" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e9d5ff" stop-opacity="0.95" />
    </linearGradient>

    <!-- Mid cloud layer (cotton-candy pink & peach) -->
    <linearGradient id="pinkPeachPuff" x1="720" y1="280" x2="720" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c026d3" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#f472b6" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#fbcfe8" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#fff1f2" stop-opacity="0.98" />
    </linearGradient>

    <!-- Warm golden sunrise crest highlights -->
    <linearGradient id="goldenCrestRim" x1="720" y1="280" x2="720" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0" />
      <stop offset="60%" stop-color="#fde047" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#fffbeb" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <g filter="url(#bottomCloudBlur)">
    <!-- Layer 1: Deep Lilac / Purple Back Wave -->
    <path d="M0 280 
             L0 160 
             C60 140 120 150 180 130 
             C240 110 320 90 400 115 
             C470 135 530 160 600 140 
             C680 115 760 100 840 125 
             C920 145 990 120 1060 110 
             C1140 100 1220 125 1300 140 
             C1360 150 1410 135 1440 140 
             L1440 280 Z" 
          fill="url(#deepCloudBank)" />

    <!-- Layer 2: Rosy Pink Billowy Cloud Puffs -->
    <path d="M0 280 
             L0 200 
             C40 185 85 160 130 165 
             C175 170 215 200 260 190 
             C310 180 345 140 400 145 
             C455 150 495 195 550 190 
             C605 185 640 150 700 155 
             C760 160 805 195 860 190 
             C915 185 960 145 1015 150 
             C1070 155 1115 185 1170 180 
             C1225 175 1275 145 1330 155 
             C1385 165 1415 180 1440 175 
             L1440 280 Z" 
          fill="url(#pinkPeachPuff)" />

    <!-- Layer 3: Warm golden-white puff tops (matching the glowing rims in photo) -->
    <circle cx="130" cy="165" r="45" fill="url(#goldenCrestRim)" />
    <circle cx="260" cy="190" r="38" fill="url(#goldenCrestRim)" />
    <circle cx="400" cy="145" r="50" fill="url(#goldenCrestRim)" />
    <circle cx="550" cy="190" r="42" fill="url(#goldenCrestRim)" />
    <circle cx="700" cy="155" r="52" fill="url(#goldenCrestRim)" />
    <circle cx="860" cy="190" r="44" fill="url(#goldenCrestRim)" />
    <circle cx="1015" cy="150" r="48" fill="url(#goldenCrestRim)" />
    <circle cx="1170" cy="180" r="40" fill="url(#goldenCrestRim)" />
    <circle cx="1330" cy="155" r="46" fill="url(#goldenCrestRim)" />

    <!-- Pure ethereal light highlights on crests -->
    <ellipse cx="400" cy="115" rx="36" ry="12" fill="#ffffff" opacity="0.6" />
    <ellipse cx="700" cy="125" rx="40" ry="14" fill="#ffffff" opacity="0.65" />
    <ellipse cx="1015" cy="120" rx="34" ry="12" fill="#ffffff" opacity="0.6" />
  </g>
</svg>
