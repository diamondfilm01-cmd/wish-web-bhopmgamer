<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 150" fill="none">
  <defs>
    <filter id="fluffy-glow-lavender" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Lavender into periwinkle soft cloud gradient -->
    <linearGradient id="cloudLavenderBase" x1="130" y1="140" x2="130" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9368ea" stop-opacity="0.88" />
      <stop offset="30%" stop-color="#ba94f8" stop-opacity="0.94" />
      <stop offset="65%" stop-color="#dcc1fe" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#f5e8ff" stop-opacity="1" />
    </linearGradient>

    <!-- Rosy blush & pale gold rim light -->
    <linearGradient id="lavenderRoseRim" x1="40" y1="20" x2="220" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.75" />
      <stop offset="65%" stop-color="#f9a8d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Deep violet shadow base -->
    <radialGradient id="lavenderDeepShade" cx="50%" cy="85%" r="65%">
      <stop offset="0%" stop-color="#6b21a8" stop-opacity="0.65" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g filter="url(#fluffy-glow-lavender)">
    <!-- Bottom atmospheric shadow shelf -->
    <ellipse cx="130" cy="116" rx="98" ry="24" fill="url(#lavenderDeepShade)" />

    <!-- Organic cumulus contour -->
    <path d="M45 115 
             C24 115 10 98 10 78 
             C10 60 25 45 44 44 
             C47 24 68 12 90 12 
             C106 12 120 20 128 32 
             C139 18 158 10 178 12 
             C202 14 220 32 222 56 
             C238 62 250 76 250 94 
             C250 114 232 122 210 120 
             C190 120 175 116 150 118 
             C120 120 80 115 45 115 
             Z" 
          fill="url(#cloudLavenderBase)" />

    <!-- Internal billowy volumetric lobes -->
    <circle cx="56" cy="76" r="32" fill="#e4c9ff" opacity="0.65" />
    <circle cx="106" cy="52" r="42" fill="#efe0ff" opacity="0.78" />
    <circle cx="170" cy="54" r="38" fill="#ebd2ff" opacity="0.72" />
    <circle cx="212" cy="85" r="28" fill="#dfbeff" opacity="0.68" />
    
    <!-- Warm sunrise light kissing the upper curves -->
    <path d="M46 45 
             C50 28 69 16 90 16 
             C104 16 116 23 124 34 
             C136 22 154 14 174 16 
             C194 18 210 32 214 52 
             C200 42 184 36 166 36 
             C148 36 134 46 124 58 
             C114 46 100 38 84 38 
             C66 38 52 44 46 45 Z" 
          fill="url(#lavenderRoseRim)" />

    <!-- Pure ethereal highlights -->
    <ellipse cx="102" cy="24" rx="22" ry="7" fill="#ffffff" opacity="0.7" />
    <ellipse cx="166" cy="22" rx="20" ry="7" fill="#ffffff" opacity="0.65" />
  </g>
</svg>
