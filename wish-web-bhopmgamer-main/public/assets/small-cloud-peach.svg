<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 130" fill="none">
  <defs>
    <filter id="fluffy-glow-peach" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Warm peach-to-pink sunrise gradient -->
    <linearGradient id="cloudPeachBase" x1="110" y1="120" x2="110" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d896ee" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#fca5a5" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#fde047" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#fffbeb" stop-opacity="1" />
    </linearGradient>

    <!-- Golden sunbeam highlight -->
    <linearGradient id="peachSunBeam" x1="50" y1="10" x2="170" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="35%" stop-color="#fef08a" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#fed7aa" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </linearGradient>

    <!-- Soft purple shadow base -->
    <radialGradient id="peachShade" cx="50%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#e879f9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fde047" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g filter="url(#fluffy-glow-peach)">
    <ellipse cx="110" cy="100" rx="78" ry="20" fill="url(#peachShade)" />

    <path d="M40 102 
             C20 102 8 88 8 72 
             C8 58 20 46 35 44 
             C39 28 55 16 75 16 
             C88 16 99 22 106 30 
             C115 18 132 12 148 14 
             C168 16 182 30 184 48 
             C198 52 208 64 208 78 
             C208 96 192 102 174 102 
             Z" 
          fill="url(#cloudPeachBase)" />

    <!-- Internal puff volumes -->
    <circle cx="50" cy="68" r="26" fill="#fde68a" opacity="0.6" />
    <circle cx="92" cy="50" r="34" fill="#fef9c3" opacity="0.75" />
    <circle cx="145" cy="48" r="32" fill="#fff7ed" opacity="0.72" />
    <circle cx="172" cy="74" r="24" fill="#fed7aa" opacity="0.65" />

    <!-- Pure sunlit crest -->
    <path d="M38 44 
             C42 30 56 18 74 18 
             C85 18 95 24 102 32 
             C112 22 128 14 144 16 
             C162 18 175 30 178 46 
             C168 38 154 34 140 34 
             C124 34 112 42 105 52 
             C98 42 86 36 72 36 
             C56 36 46 42 38 44 Z" 
          fill="url(#peachSunBeam)" />

    <ellipse cx="88" cy="24" rx="18" ry="6" fill="#ffffff" opacity="0.8" />
    <ellipse cx="138" cy="22" rx="16" ry="6" fill="#ffffff" opacity="0.75" />
  </g>
</svg>
