<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 800" fill="none">
  <defs>
    <filter id="flankCloudBlur" x="-20%" y="-10%" width="140%" height="120%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="flankLavenderBase" x1="0" y1="400" x2="300" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#c084fc" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#f472b6" stop-opacity="0.9" />
      <stop offset="95%" stop-color="#ffe4e6" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="flankGoldHighlight" x1="0" y1="0" x2="320" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#fed7aa" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <g filter="url(#flankCloudBlur)">
    <!-- Vertical series of billowy puffy cloud masses framing the side -->
    <!-- Puff Cluster 1 (Top) -->
    <path d="M0 0 L0 180 C40 180 80 160 110 140 C145 115 160 80 150 45 C140 15 100 0 70 0 Z" fill="url(#flankLavenderBase)" />
    <circle cx="110" cy="90" r="50" fill="url(#flankGoldHighlight)" opacity="0.6" />

    <!-- Puff Cluster 2 (Upper Middle) -->
    <path d="M0 160 L0 360 C50 360 100 345 140 310 C185 270 200 215 175 175 C150 140 90 150 50 160 Z" fill="url(#flankLavenderBase)" />
    <circle cx="140" cy="240" r="60" fill="url(#flankGoldHighlight)" opacity="0.65" />

    <!-- Puff Cluster 3 (Central Prominence) -->
    <path d="M0 340 L0 580 C70 580 140 550 190 500 C245 440 250 370 210 325 C170 280 90 310 40 340 Z" fill="url(#flankLavenderBase)" />
    <circle cx="170" cy="420" r="75" fill="url(#flankGoldHighlight)" opacity="0.7" />

    <!-- Puff Cluster 4 (Lower Middle) -->
    <path d="M0 560 L0 750 C60 750 120 720 165 670 C210 615 210 550 170 515 C130 480 70 520 20 560 Z" fill="url(#flankLavenderBase)" />
    <circle cx="145" cy="620" r="65" fill="url(#flankGoldHighlight)" opacity="0.65" />

    <!-- Puff Cluster 5 (Bottom) -->
    <path d="M0 720 L0 800 L280 800 C270 760 220 730 170 730 C120 730 60 710 0 720 Z" fill="url(#flankLavenderBase)" />
  </g>
</svg>
