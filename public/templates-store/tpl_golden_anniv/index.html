<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Golden Luxe Anniversary Celebration | WishMagic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 15%, #2c1a06 0%, #150d03 45%, #080501 100%);
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .font-luxury { font-family: 'Cinzel', serif; }
    .gold-gradient-text {
      background: linear-gradient(135deg, #FFF3B0 0%, #CA9E59 50%, #9A6F29 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gold-glow {
      text-shadow: 0 0 15px rgba(251, 191, 36, 0.6), 0 0 35px rgba(217, 119, 6, 0.4);
    }
    .glass-gold-card {
      background: rgba(30, 20, 10, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(212, 175, 55, 0.35);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.15);
    }
    @keyframes sparkleFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.6; }
      50% { transform: translateY(-15px) rotate(5deg); opacity: 1; }
    }
    .sparkle-elem {
      animation: sparkleFloat 4s ease-in-out infinite;
    }
  </style>
</head>
<body class="relative flex flex-col items-center justify-center p-4 sm:p-8 min-h-screen">
  <!-- Ambient Gold Light Flares -->
  <div class="fixed top-12 -left-20 w-80 h-80 bg-amber-500/15 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="fixed bottom-12 -right-20 w-96 h-96 bg-yellow-600/15 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="relative z-10 w-full max-w-xl mx-auto my-auto text-center flex flex-col items-center">
    <!-- Occasion Badge -->
    <div class="inline-flex items-center gap-2 px-5 py-1.5 rounded-full bg-amber-950/60 backdrop-blur-md border border-amber-500/40 text-xs sm:text-sm font-semibold text-amber-300 shadow-xl mb-6">
      <span>✨ Golden Milestone Anniversary</span>
      <span class="text-amber-500/50">•</span>
      <span data-wm="event_date">October 25, 2026</span>
    </div>

    <!-- Frame Photo -->
    <div class="relative group mb-6 sparkle-elem">
      <div class="absolute -inset-2 bg-gradient-to-tr from-amber-400 via-yellow-600 to-amber-200 rounded-3xl blur-md opacity-75"></div>
      <div class="relative w-44 h-44 sm:w-56 sm:h-56 rounded-2xl overflow-hidden border-2 border-amber-300/60 shadow-2xl bg-black/50">
        <img data-wm="photo_1" id="wm-img-photo_1" src="https://images.unsplash.com/photo-1519741497674-611481863552?w=500&auto=format&fit=crop&q=80" alt="Couple Photo" class="w-full h-full object-cover"/>
      </div>
      <div class="absolute -top-4 -right-3 text-3xl">💍</div>
    </div>

    <!-- Recipient / Couple Name -->
    <h1 class="font-luxury text-3xl sm:text-5xl font-extrabold tracking-wide leading-tight mb-2">
      <span class="block text-amber-200/80 text-xs sm:text-sm uppercase tracking-[0.3em] font-medium mb-1">To Our Wonderful</span>
      <span data-wm="recipient_name" class="gold-gradient-text gold-glow">Rohan &amp; Ananya</span>
    </h1>

    <!-- Glass Gold Message Card -->
    <div class="glass-gold-card rounded-2xl p-6 sm:p-8 mt-5 text-left w-full relative overflow-hidden">
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-amber-300 via-yellow-500 to-amber-600"></div>
      <div class="text-2xl text-amber-400 mb-2 font-serif opacity-90">“</div>
      <p data-wm="custom_message" class="text-sm sm:text-base leading-relaxed text-amber-100/90 font-medium whitespace-pre-line mb-4">
        May your love grow deeper and more beautiful with each passing sunset. Wishing you a lifetime filled with timeless joy, laughter, and unbreakable companionship!
      </p>
      
      <!-- Sender Signature -->
      <div class="flex items-center justify-between pt-4 border-t border-amber-500/20 mt-4 text-xs sm:text-sm text-amber-200/90">
        <span class="text-amber-400/70">With profound love &amp; regards,</span>
        <span data-wm="sender_name" class="font-bold text-amber-300 gold-glow">Sharma Family</span>
      </div>
    </div>

    <!-- Gold Confetti Interactive Button -->
    <button onclick="blastGoldConfetti()" class="mt-8 px-7 py-3 rounded-full bg-gradient-to-r from-amber-500 via-yellow-600 to-amber-700 text-amber-950 font-black text-sm shadow-[0_0_30px_rgba(245,158,11,0.4)] hover:scale-105 active:scale-95 transition-all flex items-center gap-2 cursor-pointer">
      <span>🥂 Toast &amp; Shower Golden Confetti</span>
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    function blastGoldConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 70,
          spread: 80,
          colors: ['#D4AF37', '#FFD700', '#FFF8DC', '#C5A059'],
          origin: { y: 0.6 }
        });
      }
    }
    window.addEventListener('load', () => setTimeout(blastGoldConfetti, 500));

    function applyWishMagicPayload(payload) {
      if (!payload) return;
      window.WishMagicData = payload;
      document.querySelectorAll('[data-wm]').forEach(el => {
        const key = el.getAttribute('data-wm');
        if (!key || payload[key] === undefined) return;
        if (el.tagName === 'IMG') {
          if (payload[key]) el.src = payload[key];
        } else {
          el.textContent = payload[key];
        }
      });
      const dateEl = document.querySelector('[data-wm="event_date"]');
      if (dateEl && payload.event_date) {
        try {
          const d = new Date(payload.event_date);
          if (!isNaN(d.getTime())) {
            dateEl.textContent = d.toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' });
          }
        } catch (e) {}
      }
    }

    window.addEventListener('message', (event) => {
      if (event.data && (event.data.type === 'WISHMAGIC_LIVE_UPDATE' || event.data.type === 'WISHMAGIC_INIT')) {
        applyWishMagicPayload(event.data.payload);
      }
    });

    if (window.WishMagicData) applyWishMagicPayload(window.WishMagicData);
  </script>
</body>
</html>
