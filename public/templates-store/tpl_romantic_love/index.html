<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eternal Romance & Love Letter | WishMagic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,400;1,700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 15%, #3d071a 0%, #1e030c 50%, #0d0106 100%);
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .font-romantic { font-family: 'Playfair Display', serif; }
    .rose-glow {
      text-shadow: 0 0 15px rgba(244, 63, 94, 0.7), 0 0 35px rgba(225, 29, 72, 0.5);
    }
    .glass-romance-card {
      background: rgba(35, 10, 20, 0.72);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(244, 63, 94, 0.35);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 35px rgba(244, 63, 94, 0.15);
    }
    @keyframes heartPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .heart-pulse { animation: heartPulse 3s ease-in-out infinite; }
  </style>
</head>
<body class="relative flex flex-col items-center justify-center p-4 sm:p-8 min-h-screen">
  <!-- Atmospheric Rose Flares -->
  <div class="fixed top-10 -left-16 w-80 h-80 bg-rose-600/20 rounded-full blur-[110px] pointer-events-none"></div>
  <div class="fixed bottom-10 -right-16 w-96 h-96 bg-pink-600/20 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="relative z-10 w-full max-w-xl mx-auto my-auto text-center flex flex-col items-center">
    <!-- Occasion Badge -->
    <div class="inline-flex items-center gap-2 px-5 py-1.5 rounded-full bg-rose-950/60 backdrop-blur-md border border-rose-500/40 text-xs sm:text-sm font-semibold text-rose-300 shadow-xl mb-6">
      <span>🌹 A Heartfelt Love Letter</span>
      <span class="text-rose-500/50">•</span>
      <span data-wm="event_date">October 14, 2026</span>
    </div>

    <!-- Couple / Celebrant Photo -->
    <div class="relative group mb-6 heart-pulse">
      <div class="absolute -inset-2 bg-gradient-to-tr from-rose-500 via-pink-600 to-red-400 rounded-3xl blur-md opacity-75"></div>
      <div class="relative w-44 h-44 sm:w-56 sm:h-56 rounded-2xl overflow-hidden border-2 border-rose-300/60 shadow-2xl bg-black/50">
        <img data-wm="photo_1" id="wm-img-photo_1" src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=500&auto=format&fit=crop&q=80" alt="Love Photo" class="w-full h-full object-cover"/>
      </div>
      <div class="absolute -top-3 -right-3 text-3xl">💖</div>
    </div>

    <!-- Recipient Name -->
    <h1 class="font-romantic text-3xl sm:text-5xl font-black italic tracking-tight leading-tight mb-2">
      <span class="block text-rose-200/80 text-xs sm:text-sm uppercase tracking-[0.25em] font-sans not-italic font-semibold mb-1">To My Dearest</span>
      <span data-wm="recipient_name" class="rose-glow text-rose-300">Pooja</span>
    </h1>

    <!-- Glass Romance Card -->
    <div class="glass-romance-card rounded-2xl p-6 sm:p-8 mt-5 text-left w-full relative overflow-hidden">
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-rose-400 via-pink-500 to-red-500"></div>
      <div class="text-2xl text-rose-400 mb-2 font-romantic italic opacity-90">“</div>
      <p data-wm="custom_message" class="font-romantic italic text-base sm:text-lg leading-relaxed text-rose-100/90 whitespace-pre-line mb-4">
        You are the melody in my silence, the sunshine in my mornings, and the comfort in every storm. Every second with you feels like an answered prayer. I love you endlessly!
      </p>
      
      <!-- Sender Signature -->
      <div class="flex items-center justify-between pt-4 border-t border-rose-500/20 mt-4 text-xs sm:text-sm text-rose-200/90 font-sans">
        <span class="text-rose-400/70">Yours forever &amp; always,</span>
        <span data-wm="sender_name" class="font-bold text-rose-300 rose-glow">Aman</span>
      </div>
    </div>

    <!-- Interactive Heart Shower Button -->
    <button onclick="blastHearts()" class="mt-8 px-7 py-3 rounded-full bg-gradient-to-r from-rose-500 via-pink-600 to-red-600 text-white font-bold text-sm shadow-[0_0_30px_rgba(244,63,94,0.5)] hover:scale-105 active:scale-95 transition-all flex items-center gap-2 cursor-pointer">
      <span>💌 Shower Love &amp; Hearts</span>
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    function blastHearts() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 50,
          spread: 70,
          colors: ['#FF1493', '#FF69B4', '#FF4500', '#E11D48'],
          origin: { y: 0.6 }
        });
      }
    }
    window.addEventListener('load', () => setTimeout(blastHearts, 500));

    function applyWishMagicPayload(payload) {
      if (!payload) return;
      window.WishMagicData = payload;
      document.querySelectorAll('[data-wm]').forEach(el => {
        const key = el.getAttribute('data-wm');
        if (!key || payload[key] === undefined) return;
        if (el.tagName === 'IMG') {
          if (payload[key]) el.src = payload[key];
        } else {
          el.textContent = payload[key];
        }
      });
      const dateEl = document.querySelector('[data-wm="event_date"]');
      if (dateEl && payload.event_date) {
        try {
          const d = new Date(payload.event_date);
          if (!isNaN(d.getTime())) {
            dateEl.textContent = d.toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' });
          }
        } catch (e) {}
      }
    }

    window.addEventListener('message', (event) => {
      if (event.data && (event.data.type === 'WISHMAGIC_LIVE_UPDATE' || event.data.type === 'WISHMAGIC_INIT')) {
        applyWishMagicPayload(event.data.payload);
      }
    });

    if (window.WishMagicData) applyWishMagicPayload(window.WishMagicData);
  </script>
</body>
</html>
