<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pop Party Balloon Bash | WishMagic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e1145 0%, #0e0724 55%, #050210 100%);
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .font-party { font-family: 'Outfit', sans-serif; }
    .glass-party-card {
      background: rgba(26, 16, 56, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(168, 85, 247, 0.4);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
    }
    @keyframes floatBalloon {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-16px) rotate(3deg); }
    }
    .float-balloon { animation: floatBalloon 3.5s ease-in-out infinite; }
  </style>
</head>
<body class="relative flex flex-col items-center justify-center p-4 sm:p-8 min-h-screen">
  <div class="fixed top-10 -left-16 w-80 h-80 bg-cyan-500/20 rounded-full blur-[110px] pointer-events-none"></div>
  <div class="fixed bottom-10 -right-16 w-96 h-96 bg-purple-600/25 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="relative z-10 w-full max-w-xl mx-auto my-auto text-center flex flex-col items-center">
    <div class="inline-flex items-center gap-2 px-5 py-1.5 rounded-full bg-cyan-950/60 backdrop-blur-md border border-cyan-400/40 text-xs sm:text-sm font-semibold text-cyan-300 shadow-xl mb-6">
      <span>🎈 Pop Party Celebration</span>
      <span class="text-cyan-500/50">•</span>
      <span data-wm="event_date">Today</span>
    </div>

    <!-- Photo Frame with Balloon Accents -->
    <div class="relative group mb-6 float-balloon">
      <div class="absolute -inset-2 bg-gradient-to-tr from-cyan-400 via-purple-500 to-pink-500 rounded-3xl blur-md opacity-80"></div>
      <div class="relative w-44 h-44 sm:w-56 sm:h-56 rounded-2xl overflow-hidden border-2 border-white/50 shadow-2xl bg-black/40">
        <img data-wm="photo_1" id="wm-img-photo_1" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=500&auto=format&fit=crop&q=80" alt="Party Photo" class="w-full h-full object-cover"/>
      </div>
      <div class="absolute -top-3 -right-3 text-3xl">🥳</div>
    </div>

    <h1 class="font-party text-3xl sm:text-5xl font-black tracking-tight leading-tight mb-2">
      <span class="block text-cyan-200/80 text-xs sm:text-sm uppercase tracking-widest font-semibold mb-1">Huge Cheers For</span>
      <span data-wm="recipient_name" class="bg-gradient-to-r from-cyan-300 via-pink-400 to-amber-300 bg-clip-text text-transparent">Kabir Mehta</span>
    </h1>

    <div class="glass-party-card rounded-2xl p-6 sm:p-8 mt-5 text-left w-full relative overflow-hidden">
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500"></div>
      <div class="text-2xl text-cyan-300 mb-2 font-serif opacity-90">“</div>
      <p data-wm="custom_message" class="text-sm sm:text-base leading-relaxed text-purple-100/90 font-medium whitespace-pre-line mb-4">
        Happy Birthday to the most energetic soul! May this year bring you epic road trips, massive wins, and countless unforgettable moments!
      </p>
      
      <div class="flex items-center justify-between pt-4 border-t border-purple-500/20 mt-4 text-xs sm:text-sm text-purple-200/90">
        <span class="text-purple-300/70">Party squad:</span>
        <span data-wm="sender_name" class="font-bold text-cyan-300">Sameer &amp; Gang</span>
      </div>
    </div>

    <button onclick="blastPopConfetti()" class="mt-8 px-7 py-3 rounded-full bg-gradient-to-r from-cyan-500 via-purple-600 to-pink-500 text-white font-black text-sm shadow-[0_0_30px_rgba(6,182,212,0.5)] hover:scale-105 active:scale-95 transition-all flex items-center gap-2 cursor-pointer">
      <span>🎈 Pop Balloons &amp; Confetti</span>
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    function blastPopConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 80,
          spread: 80,
          colors: ['#06B6D4', '#EC4899', '#A855F7', '#F59E0B'],
          origin: { y: 0.6 }
        });
      }
    }
    window.addEventListener('load', () => setTimeout(blastPopConfetti, 500));

    function applyWishMagicPayload(payload) {
      if (!payload) return;
      window.WishMagicData = payload;
      document.querySelectorAll('[data-wm]').forEach(el => {
        const key = el.getAttribute('data-wm');
        if (!key || payload[key] === undefined) return;
        if (el.tagName === 'IMG') {
          if (payload[key]) el.src = payload[key];
        } else {
          el.textContent = payload[key];
        }
      });
      const dateEl = document.querySelector('[data-wm="event_date"]');
      if (dateEl && payload.event_date) {
        try {
          const d = new Date(payload.event_date);
          if (!isNaN(d.getTime())) {
            dateEl.textContent = d.toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' });
          }
        } catch (e) {}
      }
    }

    window.addEventListener('message', (event) => {
      if (event.data && (event.data.type === 'WISHMAGIC_LIVE_UPDATE' || event.data.type === 'WISHMAGIC_INIT')) {
        applyWishMagicPayload(event.data.payload);
      }
    });

    if (window.WishMagicData) applyWishMagicPayload(window.WishMagicData);
  </script>
</body>
</html>
