<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Experience | WishMagic</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 20%, #2e0854 0%, #150529 50%, #080114 100%);
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .font-display { font-family: 'Outfit', sans-serif; }
    .neon-text-glow {
      text-shadow: 0 0 10px rgba(236,72,153,0.8), 0 0 30px rgba(168,85,247,0.7), 0 0 60px rgba(236,72,153,0.5);
    }
    .gold-glow {
      text-shadow: 0 0 10px rgba(251,191,36,0.8), 0 0 25px rgba(245,158,11,0.6);
    }
    .card-glass {
      background: rgba(25, 12, 46, 0.75);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(168, 85, 247, 0.35);
      box-shadow: 0 20px 60px -15px rgba(0, 0, 0, 0.7), 0 0 40px rgba(147, 51, 234, 0.2);
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1.5deg); }
    }
    .animate-float {
      animation: floatSlow 4s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.05); }
    }
    .glow-orb {
      animation: pulseGlow 6s ease-in-out infinite;
    }
  </style>
</head>
<body class="relative flex flex-col items-center justify-center p-4 sm:p-8 min-h-screen">
  <!-- Atmospheric background lights -->
  <div class="glow-orb fixed top-10 -left-20 w-80 h-80 bg-pink-600/30 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="glow-orb fixed bottom-10 -right-20 w-96 h-96 bg-purple-600/30 rounded-full blur-[120px] pointer-events-none" style="animation-delay: 2s;"></div>
  
  <div class="relative z-10 w-full max-w-xl mx-auto my-auto text-center flex flex-col items-center">
    <!-- Occasion Badge with Date -->
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/10 backdrop-blur-md border border-purple-400/30 text-xs sm:text-sm font-semibold text-pink-300 shadow-lg mb-6">
      <span>✨ A Special Celebration</span>
      <span class="text-white/40">•</span>
      <span data-wm="event_date">{{event_date}}</span>
    </div>

    <!-- Main Celebrant Photo with Glowing Glass Frame -->
    <div class="relative group mb-6 animate-float">
      <div class="absolute -inset-2 bg-gradient-to-tr from-pink-500 via-purple-500 to-amber-300 rounded-3xl blur-lg opacity-75 group-hover:opacity-100 transition duration-700"></div>
      <div class="relative w-44 h-44 sm:w-56 sm:h-56 rounded-2xl overflow-hidden border-2 border-white/40 shadow-2xl bg-black/40">
        <img data-wm="photo_1" id="wm-img-photo_1" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80" alt="Celebrant Photo" class="w-full h-full object-cover"/>
      </div>
      <!-- Crown emoji sticker -->
      <div class="absolute -top-4 -right-3 text-3xl filter drop-shadow-[0_0_12px_rgba(251,191,36,0.9)]">
        👑
      </div>
    </div>

    <!-- Headline: Recipient Name -->
    <h1 class="font-display text-4xl sm:text-6xl font-black tracking-tight leading-tight mb-2">
      <span class="block text-white/90 text-xl sm:text-2xl font-bold uppercase tracking-widest text-pink-400 mb-1">Happy Birthday</span>
      <span data-wm="recipient_name" class="neon-text-glow bg-gradient-to-r from-pink-400 via-purple-300 to-amber-200 bg-clip-text text-transparent">{{recipient_name}}</span>
    </h1>

    <!-- Glass Message Card -->
    <div class="card-glass rounded-2xl p-6 sm:p-8 mt-4 text-left w-full relative overflow-hidden">
      <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-pink-500 via-purple-500 to-amber-400"></div>
      <div class="text-2xl text-amber-300 mb-2 font-serif opacity-80">“</div>
      <p data-wm="custom_message" class="text-sm sm:text-base leading-relaxed text-purple-100/90 font-medium whitespace-pre-line mb-4">
{{custom_message}}
      </p>
      
      <!-- Sender Signature -->
      <div class="flex items-center justify-between pt-4 border-t border-white/10 mt-4 text-xs sm:text-sm text-purple-200">
        <span class="text-purple-300/70">Warmest wishes from</span>
        <span data-wm="sender_name" class="font-bold text-amber-300 gold-glow">{{sender_name}}</span>
      </div>
    </div>

    <!-- Video Element (Optional if customized) -->
    <div id="wm-video-container" class="w-full mt-6 hidden">
      <video data-wm="video_1" id="wm-vid-video_1" class="w-full rounded-2xl border border-purple-400/40 shadow-xl" controls></video>
    </div>

    <!-- Confetti interactive button -->
    <button onclick="blastConfetti()" class="mt-8 px-6 py-3 rounded-full bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 text-white font-bold text-sm shadow-[0_0_25px_rgba(236,72,153,0.5)] hover:scale-105 active:scale-95 transition-all flex items-center gap-2">
      <span>🎉 Burst Magical Confetti</span>
    </button>
  </div>

  <!-- Audio Background Player (optional) -->
  <audio data-wm="bg_music" id="wm-audio" loop></audio>

  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    function blastConfetti() {
      if (typeof confetti === 'function') {
        confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
        setTimeout(() => {
          confetti({ particleCount: 60, angle: 60, spread: 55, origin: { x: 0 } });
          confetti({ particleCount: 60, angle: 120, spread: 55, origin: { x: 1 } });
        }, 250);
      }
    }

    // Auto-blast on load
    window.addEventListener('load', () => {
      setTimeout(blastConfetti, 600);
    });

    // WishMagic Dynamic Injector Engine
    function applyWishMagicPayload(payload) {
      if (!payload) return;
      window.WishMagicData = payload;

      // 1. Inject by data-wm attributes
      document.querySelectorAll('[data-wm]').forEach(el => {
        const key = el.getAttribute('data-wm');
        if (!key || payload[key] === undefined) return;

        if (el.tagName === 'IMG') {
          if (payload[key]) el.src = payload[key];
        } else if (el.tagName === 'VIDEO') {
          if (payload[key]) {
            el.src = payload[key];
            const container = document.getElementById('wm-video-container');
            if (container) container.classList.remove('hidden');
          }
        } else if (el.tagName === 'AUDIO') {
          if (payload[key]) {
            el.src = payload[key];
            el.play().catch(() => console.log('Audio autoplay prevented'));
          }
        } else {
          el.textContent = payload[key];
        }
      });

      // 2. Format event_date if present
      const dateEl = document.querySelector('[data-wm="event_date"]');
      if (dateEl && payload.event_date) {
        try {
          const d = new Date(payload.event_date);
          if (!isNaN(d.getTime())) {
            dateEl.textContent = d.toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' });
          }
        } catch (e) {}
      }
    }

    // Listen for live updates from WishMagic Studio customizer
    window.addEventListener('message', (event) => {
      if (event.data && (event.data.type === 'WISHMAGIC_LIVE_UPDATE' || event.data.type === 'WISHMAGIC_INIT')) {
        applyWishMagicPayload(event.data.payload);
      }
    });

    // If global WishMagicData was already set before script execution
    if (window.WishMagicData) {
      applyWishMagicPayload(window.WishMagicData);
    }
  </script>
</body>
</html>
