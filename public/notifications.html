<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <base href="/"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>WishMagic | In-App Notifications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
  <script src="/js/tailwind-config.js?v=20261014_v6"></script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    if (typeof tailwind !== 'undefined' && typeof sharedTailwindConfig !== 'undefined') {
      tailwind.config = sharedTailwindConfig;
    }
  </script>
  <script src="js/api-client.js"></script>
  <script src="/js/firebase-auth.js?v=20261014_v6"></script>
  <script src="/js/auth-service.js?v=20261014_v6"></script>
  <script src="js/WishMagicCore.js"></script>
  <script src="/js/site-theme.js?v=20261014_v6"></script>
  <link id="wishmagic-cloud-css" rel="stylesheet" href="/css/cloud-background.css?v=20261014_v6"/>
</head>
<body class="bg-[#0b0217] text-slate-100 font-sans min-h-screen antialiased selection:bg-purple-600 selection:text-white flex flex-col">

<!-- Navigation Header -->
<header class="h-16 border-b border-purple-900/40 bg-[#0e041e]/80 backdrop-blur-md sticky top-0 z-40 px-4 sm:px-8 flex items-center justify-between">
  <div class="flex items-center gap-6">
    <a href="/" class="flex items-center gap-2 text-pink-500 font-bold text-lg tracking-tight hover:opacity-90 transition-opacity">
      <span class="material-symbols-outlined text-[24px]">auto_fix_high</span>
      <span>WishMagic</span>
    </a>
    <nav class="hidden sm:flex items-center gap-5 text-sm text-slate-300">
      <a href="/templates" class="hover:text-white transition-colors">Templates</a>
      <a href="/my-wishes" class="hover:text-white transition-colors">My Wishes</a>
      <a href="/pricing" class="hover:text-white transition-colors">VIP Pass</a>
    </nav>
  </div>
  <div class="flex items-center gap-4">
    <a href="/account" class="text-xs text-slate-400 hover:text-white transition-colors flex items-center gap-1">
      <span class="material-symbols-outlined text-[18px]">manage_accounts</span>
      <span>Settings</span>
    </a>
  </div>
</header>

<!-- Main Container -->
<main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-8 space-y-6">
  <!-- Top Bar -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-purple-900/30">
    <div>
      <h1 class="text-2xl font-bold text-white flex items-center gap-2">
        <span>Notifications</span>
        <span id="unread-pill" class="text-xs text-purple-400 font-normal"></span>
      </h1>
      <p class="text-xs text-slate-400 mt-1">Updates on your celebration links, upcoming dates, and platform notices.</p>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="handleMarkAllRead()" id="btn-mark-all" class="px-3.5 py-1.5 rounded-xl border border-purple-800/40 hover:bg-purple-900/30 text-xs font-semibold text-slate-300 transition-colors flex items-center gap-1.5">
        <span class="material-symbols-outlined text-[16px]">done_all</span> Mark all read
      </button>
      <button onclick="loadUserNotifications()" class="p-2 rounded-xl border border-purple-800/40 hover:bg-purple-900/30 text-slate-300 transition-colors" title="Refresh">
        <span class="material-symbols-outlined text-[18px]">refresh</span>
      </button>
    </div>
  </div>

  <!-- Filter Buttons Bar (Segmented Controls) -->
  <div class="flex items-center gap-1.5 p-1 bg-purple-950/40 rounded-xl border border-purple-900/40 w-fit text-xs">
    <button onclick="setFilter('all')" id="filter-all" class="px-3 py-1.5 font-medium rounded-lg transition-colors bg-purple-600 text-white shadow-sm">
      All
    </button>
    <button onclick="setFilter('unread')" id="filter-unread" class="px-3 py-1.5 font-medium rounded-lg transition-colors text-slate-400 hover:text-white">
      Unread
    </button>
    <button onclick="setFilter('reminders')" id="filter-reminders" class="px-3 py-1.5 font-medium rounded-lg transition-colors text-slate-400 hover:text-white">
      Reminders
    </button>
    <button onclick="setFilter('announcements')" id="filter-announcements" class="px-3 py-1.5 font-medium rounded-lg transition-colors text-slate-400 hover:text-white">
      Announcements
    </button>
  </div>

  <!-- Notification Feed -->
  <div id="notifications-feed" class="space-y-3">
    <div class="py-16 text-center text-sm text-slate-400">Loading notifications...</div>
  </div>
</main>

<script>
let currentFilter = 'all';
let allNotifications = [];

function setFilter(filter) {
  currentFilter = filter;
  ['all', 'unread', 'reminders', 'announcements'].forEach(f => {
    const btn = document.getElementById(`filter-${f}`);
    if (f === filter) {
      btn.className = 'px-3 py-1.5 font-medium rounded-lg transition-colors bg-purple-600 text-white shadow-sm';
    } else {
      btn.className = 'px-3 py-1.5 font-medium rounded-lg transition-colors text-slate-400 hover:text-white';
    }
  });
  renderFeed();
}

async function loadUserNotifications() {
  const feed = document.getElementById('notifications-feed');
  const user = window.WishMagicCore?.getCurrentUser?.() || null;
  const userId = user ? user.id : 'usr_ankit_101';

  try {
    const res = await fetch(`/api/notifications?userId=${userId}&limit=50`);
    const data = await res.json();
    if (!data.success) throw new Error(data.message || 'Failed to load notifications');

    allNotifications = data.notifications || [];
    const unreadCount = data.unreadCount || allNotifications.filter(n => !n.readAt && !n.read_at).length;

    const unreadPill = document.getElementById('unread-pill');
    if (unreadCount > 0) {
      unreadPill.innerText = `· ${unreadCount} unread`;
    } else {
      unreadPill.innerText = '· All caught up';
    }

    renderFeed();
  } catch (err) {
    feed.innerHTML = `<div class="py-12 text-center text-sm text-rose-400">Error loading notifications: ${escapeHtml(err.message)}</div>`;
  }
}

function renderFeed() {
  const feed = document.getElementById('notifications-feed');
  let list = [...allNotifications];

  if (currentFilter === 'unread') {
    list = list.filter(n => !n.readAt && !n.read_at);
  } else if (currentFilter === 'reminders') {
    list = list.filter(n => n.type && (n.type.includes('REMINDER') || n.type.includes('EXPIRING') || n.type.includes('EXPIRED')));
  } else if (currentFilter === 'announcements') {
    list = list.filter(n => n.type === 'ADMIN_ANNOUNCEMENT' || n.type === 'SYSTEM_NOTICE');
  }

  if (list.length === 0) {
    feed.innerHTML = `
      <div class="p-12 text-center rounded-2xl bg-purple-950/20 border border-purple-900/30">
        <span class="material-symbols-outlined text-[36px] text-purple-400 mb-2">notifications_paused</span>
        <div class="text-sm font-semibold text-slate-300">No notifications in this view</div>
        <div class="text-xs text-slate-500 mt-1">You're up to date! Check back later for celebration reminders and notices.</div>
      </div>
    `;
    return;
  }

  feed.innerHTML = list.map(n => {
    const isUnread = !n.readAt && !n.read_at;
    const dateFormatted = new Date(n.createdAt || n.created_at).toLocaleString(undefined, {
      month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
    });

    let iconName = n.icon || 'notifications';
    if (n.type === 'WISH_PUBLISHED') iconName = 'public';
    else if (n.type === 'ADMIN_ANNOUNCEMENT') iconName = 'campaign';
    else if (n.type && n.type.includes('EXPIRING')) iconName = 'hourglass_bottom';

    return `
      <div class="p-4 sm:p-5 rounded-2xl transition-all ${isUnread ? 'bg-purple-950/40 border border-purple-600/40 shadow-lg shadow-purple-950/20' : 'bg-[#120824]/60 border border-purple-900/30'} flex items-start gap-4">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 ${isUnread ? 'bg-purple-600 text-white' : 'bg-purple-900/30 text-purple-400'}">
          <span class="material-symbols-outlined text-[20px]">${iconName}</span>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center justify-between gap-2">
            <h3 class="text-sm font-semibold text-white truncate">${escapeHtml(n.title)}</h3>
            <span class="text-xs text-slate-500 flex-shrink-0">${dateFormatted}</span>
          </div>
          <p class="text-xs text-slate-300 mt-1 leading-relaxed">${escapeHtml(n.message)}</p>
          <div class="flex items-center gap-4 mt-3 text-xs">
            ${n.actionUrl || n.action_url ? `
              <a href="${escapeHtml(n.actionUrl || n.action_url)}" class="text-purple-400 hover:text-purple-300 font-semibold inline-flex items-center gap-1">
                View celebration <span class="material-symbols-outlined text-[14px]">arrow_forward</span>
              </a>
            ` : ''}
            ${isUnread ? `
              <button onclick="handleMarkRead('${n.id}')" class="text-slate-400 hover:text-white transition-colors">
                Mark as read
              </button>
            ` : ''}
            <button onclick="handleDelete('${n.id}')" class="text-slate-500 hover:text-rose-400 transition-colors ml-auto">
              Delete
            </button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

async function handleMarkRead(id) {
  try {
    const res = await fetch(`/api/notifications/${id}/read`, { method: 'PUT' });
    const data = await res.json();
    if (!data.success) throw new Error(data.message || 'Failed to update read state');
    const target = allNotifications.find(n => n.id === id);
    if (target) {
      target.readAt = new Date().toISOString();
      target.read_at = target.readAt;
    }
    renderFeed();
  } catch (err) {
    alert(err.message);
  }
}

async function handleMarkAllRead() {
  const user = window.WishMagicCore?.getCurrentUser?.() || null;
  const userId = user ? user.id : 'usr_ankit_101';
  try {
    const res = await fetch('/api/notifications/mark-all-read', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId })
    });
    const data = await res.json();
    if (!data.success) throw new Error(data.message || 'Failed to mark all read');
    allNotifications.forEach(n => {
      n.readAt = new Date().toISOString();
      n.read_at = n.readAt;
    });
    document.getElementById('unread-pill').innerText = '· All caught up';
    renderFeed();
  } catch (err) {
    alert(err.message);
  }
}

async function handleDelete(id) {
  try {
    const res = await fetch(`/api/notifications/${id}`, { method: 'DELETE' });
    const data = await res.json();
    if (!data.success) throw new Error(data.message || 'Failed to delete');
    allNotifications = allNotifications.filter(n => n.id !== id);
    renderFeed();
  } catch (err) {
    alert(err.message);
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

document.addEventListener('DOMContentLoaded', loadUserNotifications);
</script>
</body>
</html>
