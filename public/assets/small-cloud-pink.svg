<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" fill="none">
  <defs>
    <!-- Soft diffuse shadow filter for fluffy volumetric look -->
    <filter id="fluffy-glow-pink" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Base cloud body gradient: Lavender base to pastel pink center -->
    <linearGradient id="cloudPinkBase" x1="120" y1="130" x2="120" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b89df5" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#e9b8f2" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#ffc2eb" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#ffeef8" stop-opacity="1" />
    </linearGradient>

    <!-- Warm sunset peach & gold rim highlight -->
    <linearGradient id="pinkGoldRim" x1="60" y1="15" x2="180" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#fef08a" stop-opacity="0.75" />
      <stop offset="75%" stop-color="#fbcfe8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </linearGradient>

    <!-- Deep underside lilac shadow -->
    <radialGradient id="pinkUnderside" cx="50%" cy="85%" r="65%">
      <stop offset="0%" stop-color="#9061f9" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g filter="url(#fluffy-glow-pink)">
    <!-- Underside shadow depth lobe -->
    <ellipse cx="120" cy="108" rx="85" ry="24" fill="url(#pinkUnderside)" />
    
    <!-- Base merged cloud puffs -->
    <path d="M50 110 
             C30 110 15 95 15 78 
             C15 63 28 50 44 48 
             C48 30 65 16 85 16 
             C98 16 110 22 118 32 
             C128 20 145 12 162 14 
             C183 16 199 32 201 52 
             C215 56 226 68 226 84 
             C226 102 210 110 190 110 
             Z" 
          fill="url(#cloudPinkBase)" />

    <!-- Secondary volumetric internal puff lobes for 3D fluffiness -->
    <!-- Puff 1: Left cheek -->
    <circle cx="58" cy="74" r="30" fill="#ffd1f1" opacity="0.6" />
    <!-- Puff 2: Center main puff -->
    <circle cx="105" cy="55" r="38" fill="#ffe4f7" opacity="0.75" />
    <!-- Puff 3: Right crest -->
    <circle cx="160" cy="52" r="35" fill="#ffd6f4" opacity="0.7" />
    <!-- Puff 4: Far right cheek -->
    <circle cx="188" cy="80" r="26" fill="#fbcfe8" opacity="0.65" />

    <!-- Golden peach sunlight crest (rim light on top curves) -->
    <path d="M48 48 
             C52 32 67 20 85 20 
             C96 20 106 25 114 34 
             C125 24 142 16 160 18 
             C178 20 193 34 196 52 
             C186 44 172 38 156 38 
             C140 38 126 46 118 56 
             C110 46 98 40 84 40 
             C68 40 56 46 48 48 Z" 
          fill="url(#pinkGoldRim)" />

    <!-- Top delicate soft white edge glow -->
    <ellipse cx="98" cy="28" rx="20" ry="8" fill="#ffffff" opacity="0.6" />
    <ellipse cx="152" cy="24" rx="18" ry="7" fill="#ffffff" opacity="0.55" />
  </g>
</svg>
