<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <base href="/"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Live Template Preview | WishMagic</title>
  <meta name="description" content="Full-screen live interactive preview of WishMagic celebration templates."/>

  <!-- WishMagic Core & UTP v1.4.0 Runtime Architecture -->
  <script src="/js/WishMagicCore.js?v=20261027_mobile2col_v1"></script>
  <script src="/js/api-client.js?v=20261027_mobile2col_v1"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="/js/firebase-auth.js?v=20261027_mobile2col_v1"></script>
  <script src="/js/auth-service.js?v=20261027_mobile2col_v1"></script>
  <script src="/js/repositories.js?v=20261027_mobile2col_v1"></script>
  <script src="/js/feature-access-service.js?v=20261027_mobile2col_v1"></script>
  <script src="/js/premium-lock-modal.js?v=20261027_mobile2col_v1"></script>
  <script src="/js/wishmagic-template-protocol.js?v=20261027_mobile2col_v1"></script>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: #090414;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Full-Screen Real Native Viewport Iframe (No fake phone/PC frames!) */
    #live-template-viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #090414;
      z-index: 10;
    }

    #live-template-iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: transparent;
    }

    /* Minimal Loading Overlay while template initializes */
    #preview-loading-skeleton {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: radial-gradient(circle at 50% 30%, #1e0b3b 0%, #090414 75%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      transition: opacity 0.25s ease;
    }

    #preview-loading-skeleton.hidden {
      opacity: 0;
      pointer-events: none;
      display: none !important;
    }

    .wm-spinner {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid rgba(236, 72, 153, 0.22);
      border-top-color: #ec4899;
      animation: wmSpin 0.75s linear infinite;
    }

    @keyframes wmSpin {
      to { transform: rotate(360deg); }
    }

    /* Error / Not Found State */
    #preview-not-found-state {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: radial-gradient(circle at 50% 30%, #1e0b3b 0%, #090414 75%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    #preview-not-found-state:not(.hidden) {
      display: flex;
    }

    .wm-not-found-card {
      max-width: 420px;
      width: 100%;
      padding: 28px 24px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(16px);
    }

    .wm-btn-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Loading Overlay -->
  <div id="preview-loading-skeleton">
    <div class="wm-spinner" aria-hidden="true"></div>
    <p style="font-size:13px;font-weight:700;color:#e2e8f0;letter-spacing:0.01em;">Opening Live Experience...</p>
  </div>

  <!-- Not Found State -->
  <div id="preview-not-found-state" class="hidden">
    <div class="wm-not-found-card">
      <div style="font-size:36px;margin-bottom:10px;">🔍</div>
      <h2 style="font-family:'Outfit',sans-serif;font-size:22px;font-weight:800;margin-bottom:8px;">Template Not Found</h2>
      <p style="font-size:13px;color:#cbd5e1;line-height:1.5;margin-bottom:20px;">
        This template may have been moved or is currently unavailable.
      </p>
      <a href="/templates.html" class="wm-btn-pill">← Explore All Templates</a>
    </div>
  </div>

  <!-- 100% Real Full-Screen Template Viewport (Automatically renders Mobile view on Phones & Desktop view on PCs) -->
  <div id="live-template-viewport">
    <iframe
      id="live-template-iframe"
      sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups"
      allow="autoplay; fullscreen"
      src="about:blank"
      title="Template Live Experience">
    </iframe>
  </div>

  <script>
    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
    window.escapeHTML = escapeHTML;

    let activeTemplate = null;
    let activeSelectedVariant = null;
    let allTemplatesList = [];

    const WM_BUILTIN_TEMPLATE_FOLDERS = {
      'tpl_glitter_birthday': 'tpl_glitter_birthday',
      'glitter-birthday-blast': 'tpl_glitter_birthday',
      'glitter-birthday-bash-3d': 'tpl_glitter_birthday',
      'glitter-birthday-bash': 'tpl_glitter_birthday',
      'tpl_romantic_starlight': 'tpl_romantic_scrapbook',
      'romantic-starlight': 'tpl_romantic_scrapbook',
      'romantic-starlight-serenade': 'tpl_romantic_scrapbook',
      'endless-love-serenade': 'tpl_romantic_scrapbook',
      'tpl_romantic_scrapbook': 'tpl_romantic_scrapbook',
      'starlit-romance-love-letter': 'tpl_romantic_scrapbook',
      'tpl_golden_elegance': 'tpl_golden_anniversary',
      'golden-elegance-anniversary': 'tpl_golden_anniversary',
      'golden-anniversary-wishes': 'tpl_golden_anniversary',
      'tpl_golden_anniversary': 'tpl_golden_anniversary',
      'golden-memories-keepsake': 'tpl_golden_anniversary',
      'tpl_neon_party': 'tpl_cosmic_aurora',
      'neon-night-celebration': 'tpl_cosmic_aurora',
      'purr-fect-birthday-party': 'tpl_cosmic_aurora',
      'tpl_cosmic_aurora': 'tpl_cosmic_aurora',
      'cosmic-aurora': 'tpl_cosmic_aurora',
      'tpl_parents_tribute': 'tpl_parents_tribute',
      'dearest-parents-tribute': 'tpl_parents_tribute',
      'heartfelt-thank-you-keepsake': 'tpl_parents_tribute',
      'tpl_midnight_countdown': 'tpl_midnight_countdown',
      'midnight-celebration-countdown': 'tpl_midnight_countdown',
      'grand-congratulations-finale': 'tpl_midnight_countdown',
      'tpl_friendship_chronicles': 'tpl_friendship_chronicles',
      'forever-friends-funhouse': 'tpl_friendship_chronicles',
      'forever-friends-polaroid-deck': 'tpl_friendship_chronicles',
      'tpl_festive_lights': 'tpl_golden_anniversary',
      'royal-festival-celebration': 'tpl_golden_anniversary',
      'royal-festival-of-lights': 'tpl_golden_anniversary',
      'tpl_test_full_sections': 'tpl_test_full_sections',
      'tpl_test_minimal_sections': 'tpl_test_minimal_sections'
    };

    function resolveCanonicalTemplateFolderClient(tpl) {
      if (!tpl) return 'tpl_glitter_birthday';
      const candidates = [tpl.id, tpl.slug, tpl.folder]
        .map(v => String(v || '').trim().replace(/^\/+/, '').replace(/^(?:templates-store|templates)\/+/, '').replace(/\/+$/, ''))
        .filter(Boolean);
      for (const c of candidates) {
        const low = c.toLowerCase();
        if (WM_BUILTIN_TEMPLATE_FOLDERS[low]) return WM_BUILTIN_TEMPLATE_FOLDERS[low];
        const prefixed = 'tpl_' + low.replace(/-/g, '_');
        if (WM_BUILTIN_TEMPLATE_FOLDERS[prefixed]) return WM_BUILTIN_TEMPLATE_FOLDERS[prefixed];
      }
      return candidates[0] || 'tpl_glitter_birthday';
    }

    function resolveTemplatePreviewUrlClient(tpl) {
      if (!tpl) return '/templates-store/tpl_glitter_birthday/index.html';
      const entryFile = tpl.entryFile || tpl.entry_file || 'index.html';
      if (tpl.previewUrl && String(tpl.previewUrl).includes('/versions/ver_')) {
        return tpl.previewUrl;
      }
      if (tpl.entryUrl && String(tpl.entryUrl).includes('/versions/ver_')) {
        return tpl.entryUrl;
      }
      const cleanFolder = resolveCanonicalTemplateFolderClient(tpl);
      return `/templates-store/${cleanFolder}/${entryFile}`;
    }

    function resolveTemplateId() {
      const path = window.location.pathname;
      if (path.includes('/template/')) {
        const parts = path.split('/template/');
        if (parts[1]) {
          const cleanId = parts[1].replace(/\/+$/, '').split('/')[0];
          if (cleanId) return decodeURIComponent(cleanId);
        }
      }
      if (path.includes('/template-preview/')) {
        const parts = path.split('/template-preview/');
        if (parts[1]) {
          const cleanId = parts[1].replace(/\/+$/, '').split('/')[0];
          if (cleanId) return decodeURIComponent(cleanId);
        }
      }
      const params = new URLSearchParams(window.location.search);
      return params.get('id') || params.get('template') || params.get('tpl') || params.get('slug') || null;
    }

    function findMatchingTemplate(templates, queryId) {
      if (!templates || templates.length === 0) return null;
      if (!queryId) return templates[0];

      const raw = String(queryId).toLowerCase().trim();
      const slug = raw.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

      let found = templates.find(t => t.id && t.id.toLowerCase() === raw);
      if (found) return found;

      found = templates.find(t => t.slug && t.slug.toLowerCase() === raw);
      if (found) return found;

      found = templates.find(t => t.folder && t.folder.toLowerCase() === raw);
      if (found) return found;

      found = templates.find(t => {
        const stripped = (t.id || '').toLowerCase().replace(/^tpl_/, '').replace(/_/g, '-');
        return stripped === slug || stripped === raw;
      });
      if (found) return found;

      found = templates.find(t => {
        const nameSlug = (t.name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        return nameSlug === slug || nameSlug === raw;
      });
      if (found) return found;

      return templates[0];
    }

    function buildCustomizeUrl(t, selectedVariant) {
      const urlParams = new URLSearchParams(window.location.search);
      const campaignId = urlParams.get('campaign') || (t && t.festivalCampaign && t.festivalCampaign.campaignId) || '';
      const campSuffix = campaignId ? `&campaign=${encodeURIComponent(campaignId)}` : '';
      if (selectedVariant) {
        return `/customize.html?template=${encodeURIComponent(t.id)}&variant=${encodeURIComponent(selectedVariant.id)}&rel=${encodeURIComponent(selectedVariant.relationshipSlug)}${campSuffix}`;
      }
      return `/customize.html?template=${encodeURIComponent(t.id)}${campSuffix}`;
    }

    function navigateToCustomize(t, selectedVariant, ev) {
      if (ev) ev.preventDefault();
      const customizeUrl = buildCustomizeUrl(t, selectedVariant);
      if (window.WishAuth && typeof window.WishAuth.isGoogleLoggedIn === 'function' && !window.WishAuth.isGoogleLoggedIn()) {
        window.WishAuth.requireGoogleAuthForCustomize(customizeUrl);
        return false;
      }
      if (window.WishFeatureAccess) {
        const access = window.WishFeatureAccess.canUseTemplate(t);
        if (!access.allowed && window.WishPremiumLock) {
          window.WishPremiumLock.open({
            context: 'template',
            template: t,
            onUnlocked: () => {
              window.location.href = customizeUrl;
            }
          });
          return false;
        }
      }
      window.location.href = customizeUrl;
      return false;
    }

    function getBrandingFooterConfig() {
      let siteSettings = {};
      try {
        siteSettings = JSON.parse(localStorage.getItem('wishmagic_site_settings_v1') || '{}') || {};
      } catch (_) {}
      const bf = siteSettings.brandingFooter || {};
      return {
        enabled: bf.enabled !== false,
        brandIcon: bf.brandIcon || '🪄',
        badgeText: bf.badgeText || '✨ Official Celebration Experience',
        websiteName: bf.websiteName || siteSettings.brandName || 'WishMagic',
        tagline: bf.tagline || 'Create Magical Celebration Websites in 60 Seconds',
        detailsText: bf.detailsText || 'Personalized 3D interactive wishes for birthdays, festivals & every special bond.',
        primaryBtnLabel: bf.primaryBtnLabel || '✨ Create For Yours',
        secondaryBtnLabel: bf.secondaryBtnLabel || '🌐 Explore More Templates',
        showPrimaryBtn: bf.showPrimaryBtn !== false,
        showSecondaryBtn: bf.showSecondaryBtn !== false,
        copyrightText: bf.copyrightText || '© 2026 WishMagic • Crafted with Love & Magic ✨'
      };
    }

    function ensureAndHydrateBrandingFooterInDoc(doc, customizeUrl, bfCfg) {
      if (!doc || !doc.body) return;
      let footer = doc.querySelector('[data-wm-platform-footer], #wm-platform-footer');
      if (!footer && bfCfg.enabled !== false) {
        footer = doc.createElement('footer');
        footer.id = 'wm-platform-footer';
        footer.setAttribute('data-wm-platform-footer', 'true');
        footer.style.cssText = 'margin:40px auto 28px;max-width:720px;padding:26px 22px;border-radius:24px;background:rgba(15,8,28,0.88);border:1px solid rgba(236,72,153,0.35);box-shadow:0 18px 45px rgba(0,0,0,0.45);backdrop-filter:blur(14px);text-align:center;color:#f8fafc;font-family:"Plus Jakarta Sans",system-ui,sans-serif;';
        footer.innerHTML = `
          <div style="display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:999px;background:rgba(236,72,153,0.16);border:1px solid rgba(236,72,153,0.38);color:#fbcfe8;font-size:12px;font-weight:700;margin-bottom:10px;">
            <span data-wm-brand-slot="icon">🪄</span>
            <span data-wm-brand-slot="badge">✨ Official Celebration Experience</span>
          </div>
          <h3 data-wm-brand-slot="name" style="margin:4px 0 6px;font-size:22px;font-weight:800;color:#ffffff;">WishMagic</h3>
          <p data-wm-brand-slot="tagline" style="margin:0 auto 6px;font-size:14px;font-weight:600;color:#f1f5f9;max-width:520px;"></p>
          <p data-wm-brand-slot="details" style="margin:0 auto 16px;font-size:12.5px;color:#cbd5e1;max-width:500px;line-height:1.5;"></p>
          <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:12px;">
            <a href="${escapeHTML(customizeUrl)}" data-wm-link="template.customize" data-wm-brand-slot="primary_cta" style="display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:700;text-decoration:none;background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff;box-shadow:0 8px 20px rgba(236,72,153,0.32);">✨ Create For Yours</a>
            <a href="/templates.html" data-wm-link="global.explore" data-wm-brand-slot="secondary_cta" style="display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:700;text-decoration:none;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.22);color:#f8fafc;">🌐 Explore More Templates</a>
          </div>
          <div data-wm-brand-slot="copyright" style="font-size:11.5px;color:#94a3b8;"></div>
        `;
        const mainEl = doc.querySelector('main') || doc.body;
        mainEl.appendChild(footer);
      }

      if (footer) {
        if (bfCfg.enabled === false) {
          footer.setAttribute('hidden', 'hidden');
          footer.style.display = 'none';
        } else {
          footer.removeAttribute('hidden');
          footer.style.display = '';
          const setSlot = (slot, val) => {
            const el = footer.querySelector(`[data-wm-brand-slot="${slot}"]`);
            if (el && val !== undefined && val !== null) el.textContent = String(val);
          };
          setSlot('icon', bfCfg.brandIcon);
          setSlot('badge', bfCfg.badgeText);
          setSlot('name', bfCfg.websiteName);
          setSlot('tagline', bfCfg.tagline);
          setSlot('details', bfCfg.detailsText);
          setSlot('copyright', bfCfg.copyrightText);
          const pBtn = footer.querySelector('[data-wm-brand-slot="primary_cta"]');
          if (pBtn) {
            pBtn.textContent = bfCfg.primaryBtnLabel;
            pBtn.setAttribute('href', customizeUrl);
            pBtn.style.display = bfCfg.showPrimaryBtn === false ? 'none' : '';
          }
          const sBtn = footer.querySelector('[data-wm-brand-slot="secondary_cta"]');
          if (sBtn) {
            sBtn.textContent = bfCfg.secondaryBtnLabel;
            sBtn.setAttribute('href', '/templates.html');
            sBtn.style.display = bfCfg.showSecondaryBtn === false ? 'none' : '';
          }
        }
      }
    }

    function applySelectedVariantOnPreviewPage(variant) {
      activeSelectedVariant = variant || null;
      const t = activeTemplate;
      if (!t) return;

      const displayTitle = activeSelectedVariant
        ? `${t.name} — ${activeSelectedVariant.relationshipLabel}`
        : t.name;
      document.title = `${displayTitle} | WishMagic Live Preview`;

      try {
        const url = new URL(window.location.href);
        url.searchParams.set('template', t.id);
        if (activeSelectedVariant) {
          url.searchParams.set('variant', activeSelectedVariant.id);
          url.searchParams.set('rel', activeSelectedVariant.relationshipSlug);
        }
        window.history.replaceState({}, '', url.toString());
      } catch (_) {}

      loadInteractivePreview(t, activeSelectedVariant);
    }

    function loadInteractivePreview(t, selectedVariant) {
      const iframe = document.getElementById('live-template-iframe');
      const loadingEl = document.getElementById('preview-loading-skeleton');
      if (!iframe || !t) return;

      const previewTargetObj = selectedVariant
        ? { ...t, entryFile: selectedVariant.entryFile || t.entryFile }
        : t;
      const url = resolveTemplatePreviewUrlClient(previewTargetObj);
      const customizeUrl = buildCustomizeUrl(t, selectedVariant);
      const bfCfg = getBrandingFooterConfig();

      iframe.removeAttribute('srcdoc');
      iframe.removeAttribute('data-fallback-applied');
      iframe.src = url;

      iframe.onload = () => {
        if (loadingEl) loadingEl.classList.add('hidden');

        const varMsgs = (selectedVariant && selectedVariant.messages) || {};
        const rawVarAssets = (selectedVariant && selectedVariant.assets) || {};
        const varAssets = {};
        Object.entries(rawVarAssets).forEach(([ak, av]) => {
          if (typeof av === 'string' && (/^https?:\/\//i.test(av) || av.startsWith('data:') || av.startsWith('/'))) {
            varAssets[ak] = av;
          }
        });
        const isCustomUploadedBundle = Boolean(t.entryUrl || t.previewUrl || t.storagePrefix || t.hasCustomCode);
        const effectiveSections = (selectedVariant && Array.isArray(selectedVariant.sections))
          ? selectedVariant.sections
          : (Array.isArray(t.sections) ? t.sections : []);
        const effectiveActions = (selectedVariant && Array.isArray(selectedVariant.actions))
          ? selectedVariant.actions
          : (Array.isArray(t.actions) ? t.actions : []);

        const sampleData = {
          templateId: t.id,
          templateSlug: t.slug || t.id,
          ...(isCustomUploadedBundle ? {} : {
            recipient_name: varMsgs.recipient_name || 'Someone Special',
            sender_name: varMsgs.sender_name || 'From Someone Who Cares',
            custom_message: varMsgs.custom_message || varMsgs.defaultWish || varMsgs.main_message || 'Wishing you a magnificent year filled with boundless joy, radiant smiles, and unforgettable magic!',
            event_date: 'Today',
            photo_1: varAssets.photo_1 || varAssets.cover || t.thumbnail || t.previewImage || '/assets/file_ab2082.png'
          }),
          variant: selectedVariant ? (selectedVariant.slug || selectedVariant.relationshipSlug || selectedVariant.id) : '',
          variantId: selectedVariant ? selectedVariant.id : '',
          variantSlug: selectedVariant ? (selectedVariant.slug || selectedVariant.id) : '',
          relationship: selectedVariant ? selectedVariant.relationshipSlug : '',
          relationshipSlug: selectedVariant ? selectedVariant.relationshipSlug : '',
          visibilityMap: (selectedVariant && selectedVariant.visibilityMap) || t.visibilityMap || {},
          disabledIds: Array.isArray(selectedVariant && selectedVariant.disabledIds) ? selectedVariant.disabledIds : (Array.isArray(t.disabledIds) ? t.disabledIds : []),
          enabledIds: Array.isArray(selectedVariant && selectedVariant.enabledIds) ? selectedVariant.enabledIds : (Array.isArray(t.enabledIds) ? t.enabledIds : []),
          sections: effectiveSections,
          actions: effectiveActions,
          messages: varMsgs,
          assets: varAssets,
          theme: selectedVariant ? selectedVariant.theme : null,
          palette: selectedVariant ? selectedVariant.theme : null,
          brandingFooter: bfCfg,
          ...varMsgs,
          ...varAssets
        };

        try {
          if (iframe.contentWindow) {
            iframe.contentWindow.postMessage({
              type: 'WISHMAGIC_INIT',
              payload: sampleData
            }, '*');
            iframe.contentWindow.postMessage({
              type: 'WISHMAGIC_BRANDING_FOOTER',
              brandingFooter: bfCfg
            }, '*');
          }
        } catch (_) {}

        try {
          const doc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
          if (!doc) return;

          // Strip any stray legacy in-template relation switcher or customizer panel (UTP v1.4.0 Rules 1 & 2)
          doc.querySelectorAll('.wm-relation-bar, #wmRelationBar, #wmCustomizerBackdrop, #wmCustomizerPanel, #wmOpenCustomizerBtn, [data-wm-in-template-customizer]').forEach(el => {
            el.remove();
          });

          if (window.WishMagicTemplate && typeof window.WishMagicTemplate.removeDisabledContentFromDom === 'function') {
            window.WishMagicTemplate.removeDisabledContentFromDom(doc, sampleData);
          }
          if (window.WishMagicTemplate && typeof window.WishMagicTemplate.applyActionsToDom === 'function') {
            window.WishMagicTemplate.applyActionsToDom(doc, sampleData.actions, sampleData);
          }

          ensureAndHydrateBrandingFooterInDoc(doc, customizeUrl, bfCfg);

          // Bind all Customize / Create links inside the previewed template to navigate the top window
          doc.querySelectorAll('a[href*="customize.html"], [data-wm-link="template.customize"], [data-wm-link="template.create"], [data-wm-brand-slot="primary_cta"]').forEach(linkEl => {
            if (linkEl.tagName === 'A') {
              linkEl.setAttribute('href', customizeUrl);
              linkEl.setAttribute('target', '_top');
            }
            linkEl.addEventListener('click', (ev) => {
              navigateToCustomize(t, selectedVariant, ev);
            });
          });

          doc.querySelectorAll('a[href*="templates.html"], [data-wm-link="global.explore"], [data-wm-link="global.browseTemplates"], [data-wm-brand-slot="secondary_cta"]').forEach(linkEl => {
            if (linkEl.tagName === 'A') {
              linkEl.setAttribute('target', '_top');
            }
          });
        } catch (_) {}
      };
    }

    async function initTemplatePreview() {
      const templateId = resolveTemplateId();
      const urlParams = new URLSearchParams(window.location.search);
      const variantParam = urlParams.get('variant') || '';
      const relParam = urlParams.get('rel') || urlParams.get('relationship') || '';
      const loadingEl = document.getElementById('preview-loading-skeleton');
      const notFoundEl = document.getElementById('preview-not-found-state');

      try {
        try {
          const cachedRaw = sessionStorage.getItem('wm_public_templates_cache_v1') || localStorage.getItem('wm_public_templates_cache_v2');
          const cachedArr = cachedRaw ? JSON.parse(cachedRaw) : null;
          if (Array.isArray(cachedArr) && cachedArr.length > 0) {
            allTemplatesList = cachedArr;
          }
        } catch (_) {}

        const qs = new URLSearchParams();
        if (variantParam) qs.set('variant', variantParam);
        if (relParam) qs.set('rel', relParam);
        const qsStr = qs.toString() ? `?${qs.toString()}` : '';

        const [allData, singleData] = await Promise.all([
          fetch('/api/templates').then(r => r.ok ? r.json() : null).catch(() => null),
          templateId
            ? fetch(`/api/templates/${encodeURIComponent(templateId)}${qsStr}`).then(r => r.ok ? r.json() : null).catch(() => null)
            : Promise.resolve(null)
        ]);

        if (allData && Array.isArray(allData.templates) && allData.templates.length > 0) {
          allTemplatesList = allData.templates;
          try { sessionStorage.setItem('wm_public_templates_cache_v1', JSON.stringify(allTemplatesList)); } catch (_) {}
        }

        window._wmLoadedTemplatesMap = window._wmLoadedTemplatesMap || {};
        allTemplatesList.forEach(t => {
          if (t && t.id) window._wmLoadedTemplatesMap[t.id] = t;
          if (t && t.slug) window._wmLoadedTemplatesMap[t.slug] = t;
        });

        let current = (singleData && singleData.success && singleData.template) ? singleData.template : null;
        if (!current && templateId) {
          current = findMatchingTemplate(allTemplatesList, templateId);
        }
        if (!current && allTemplatesList.length > 0) {
          current = allTemplatesList[0];
        }

        if (!current) {
          if (loadingEl) loadingEl.classList.add('hidden');
          if (notFoundEl) notFoundEl.classList.remove('hidden');
          return;
        }

        activeTemplate = current;

        if (window.WishMagicVariantFlow && window.WishMagicVariantFlow.isVariantFamily(activeTemplate)) {
          const avail = window.WishMagicVariantFlow.getAvailablePublishedVariants(activeTemplate);
          const explicitRelOrVar = variantParam || relParam || window.WishMagicVariantFlow.getActiveRelationFilter();
          if (explicitRelOrVar) {
            const matched = window.WishMagicVariantFlow.resolveVariantForRelation(activeTemplate, explicitRelOrVar) ||
              avail.find(v => v.isDefault) || avail[0] || null;
            applySelectedVariantOnPreviewPage(matched);
            return;
          }

          if (avail.length === 1) {
            applySelectedVariantOnPreviewPage(avail[0]);
            return;
          }

          if (avail.length > 1) {
            if (loadingEl) loadingEl.classList.add('hidden');
            window.WishMagicVariantFlow.showRelationSelectionModal(activeTemplate, avail, 'preview', {
              onSelectVariant: (chosen) => {
                if (loadingEl) loadingEl.classList.remove('hidden');
                applySelectedVariantOnPreviewPage(chosen);
              },
              onCancel: () => {
                if (window.history.length > 1) window.history.back();
                else window.location.href = '/templates.html';
              }
            });
            return;
          }
        }

        applySelectedVariantOnPreviewPage(null);
      } catch (err) {
        console.error('Error loading template preview:', err);
        if (allTemplatesList && allTemplatesList.length > 0) {
          activeTemplate = allTemplatesList[0];
          applySelectedVariantOnPreviewPage(null);
        } else {
          if (loadingEl) loadingEl.classList.add('hidden');
          if (notFoundEl) notFoundEl.classList.remove('hidden');
        }
      }
    }

    document.addEventListener('DOMContentLoaded', initTemplatePreview);
  </script>
</body>
</html>
