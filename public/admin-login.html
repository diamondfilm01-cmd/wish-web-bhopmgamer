<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <base href="/"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Admin Login | WishMagic Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  
  <script src="/js/tailwind-config.js"></script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    if (typeof tailwind !== 'undefined' && typeof sharedTailwindConfig !== 'undefined') {
      tailwind.config = sharedTailwindConfig;
    }
  </script>
  <link rel="stylesheet" href="/css/admin-theme.css"/>
  <!-- Firebase Official SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="/js/firebase-auth.js"></script>
  <style>
    body {
      background-color: #07040d !important;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(124, 58, 237, 0.2), transparent 35%),
        radial-gradient(circle at 85% 85%, rgba(236, 72, 153, 0.16), transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(79, 70, 229, 0.08), transparent 50%);
    }
    .glass-card {
      background: rgba(18, 10, 34, 0.84);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(139, 92, 246, 0.25);
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.85), 0 0 30px rgba(124, 58, 237, 0.18);
    }
    .input-focus {
      transition: all 0.2s ease;
    }
    .input-focus:focus {
      border-color: #a855f7 !important;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.3) !important;
    }
  </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4 selection:bg-purple-600 selection:text-white relative overflow-x-hidden font-['Plus+Jakarta+Sans',sans-serif]">

  <!-- Ambient Glowing Orbs -->
  <div class="fixed -top-32 -left-32 w-96 h-96 bg-purple-600/20 rounded-full blur-[128px] pointer-events-none animate-pulse"></div>
  <div class="fixed -bottom-32 -right-32 w-96 h-96 bg-pink-600/15 rounded-full blur-[128px] pointer-events-none"></div>

  <!-- Main Login Card Container -->
  <div class="w-full max-w-md glass-card rounded-3xl p-7 sm:p-9 relative z-10 flex flex-col gap-6">

    <!-- Header & Branding -->
    <div class="flex flex-col items-center text-center gap-3">
      <div class="relative">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-600 via-indigo-600 to-pink-500 flex items-center justify-center shadow-[0_0_35px_rgba(168,85,247,0.5)] border border-white/20">
          <span class="material-symbols-outlined text-white text-3xl">admin_panel_settings</span>
        </div>
        <div class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full bg-emerald-500 border-2 border-[#07040d] flex items-center justify-center shadow-lg">
          <span class="material-symbols-outlined text-[12px] text-white font-bold">check</span>
        </div>
      </div>

      <div>
        <h1 class="text-2xl font-extrabold text-white tracking-tight flex items-center justify-center gap-1.5 font-['Outfit',sans-serif]">
          <span>WishMagic</span>
          <span class="bg-gradient-to-r from-purple-400 via-pink-400 to-amber-300 bg-clip-text text-transparent">Studio</span>
        </h1>
        <p class="text-xs text-purple-200/70 font-medium mt-0.5">Admin Security Gateway</p>
      </div>
    </div>

    <!-- Alert / Error Banner -->
    <div id="login-alert" class="hidden p-3.5 rounded-2xl bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs font-medium flex items-center gap-2.5 transition-all">
      <span class="material-symbols-outlined text-base shrink-0 text-rose-400">error</span>
      <span id="alert-message">Authentication failed.</span>
    </div>

    <!-- Success / Info Banner -->
    <div id="login-info" class="hidden p-3.5 rounded-2xl bg-emerald-500/15 border border-emerald-500/30 text-emerald-300 text-xs font-medium flex items-center gap-2.5 transition-all">
      <span class="material-symbols-outlined text-base shrink-0 text-emerald-400">check_circle</span>
      <span id="info-message">Ready.</span>
    </div>

    <!-- LOGIN FORM -->
    <form id="firebase-login-form" onsubmit="handleFirebaseLogin(event)" class="flex flex-col gap-4">
      <div>
        <label class="block text-xs font-semibold text-purple-200/80 uppercase tracking-wider mb-1.5">
          Email Address
        </label>
        <div class="relative flex items-center">
          <span class="material-symbols-outlined absolute left-3.5 text-purple-400 text-lg">mail</span>
          <input id="admin-email-input" type="email" required autocomplete="username" placeholder="admin@example.com" class="input-focus w-full pl-11 pr-4 py-3 rounded-xl bg-purple-950/40 border border-purple-500/30 text-white text-sm focus:outline-none placeholder-gray-500 transition-colors"/>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-purple-200/80 uppercase tracking-wider mb-1.5">
          Password
        </label>
        <div class="relative flex items-center">
          <span class="material-symbols-outlined absolute left-3.5 text-purple-400 text-lg">lock</span>
          <input id="admin-password-input" type="password" required autocomplete="current-password" placeholder="Enter your password" class="input-focus w-full pl-11 pr-11 py-3 rounded-xl bg-purple-950/40 border border-purple-500/30 text-white text-sm focus:outline-none placeholder-gray-500 transition-colors"/>
          <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 text-purple-400 hover:text-white transition cursor-pointer" title="Toggle password view">
            <span id="pwd-toggle-icon" class="material-symbols-outlined text-lg">visibility</span>
          </button>
        </div>
      </div>

      <button type="submit" id="login-submit-btn" class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-purple-600 via-indigo-600 to-pink-600 hover:opacity-95 text-white font-bold text-sm tracking-wide shadow-[0_0_30px_rgba(147,51,234,0.4)] flex items-center justify-center gap-2 transition-all mt-1 cursor-pointer">
        <span class="material-symbols-outlined text-lg">login</span>
        <span>Sign In to Admin Studio</span>
      </button>
    </form>

    <!-- Footer Return Link -->
    <div class="text-center border-t border-purple-900/40 pt-4">
      <a href="/" class="text-xs text-purple-300/70 hover:text-white transition-colors inline-flex items-center gap-1.5 font-medium">
        <span class="material-symbols-outlined text-sm">arrow_back</span>
        <span>Return to WishMagic Main Website</span>
      </a>
    </div>

  </div>

  <script>
    function getAdminDestination(token) {
      let currentPath = window.location.pathname;
      if (!currentPath || currentPath.endsWith('/login') || currentPath.endsWith('admin-login.html') || currentPath === '/') {
        currentPath = '/admin/anktech/anktech/admin/overview';
      }
      return token ? `${currentPath}?auth=${encodeURIComponent(token)}` : currentPath;
    }

    // Check if user is ALREADY authenticated as admin on startup
    (async function checkExistingAdminSession() {
      const adminToken = localStorage.getItem('wishmagic_admin_token') || localStorage.getItem('wishmagic_auth_token');
      const isVerified = sessionStorage.getItem('wm_admin_verified') === 'true';
      
      if (adminToken && isVerified) {
        window.location.replace(getAdminDestination(adminToken));
        return;
      }

      if (adminToken) {
        try {
          const res = await fetch('/api/auth/session', {
            credentials: 'include',
            headers: { 'Authorization': 'Bearer ' + adminToken }
          });
          if (res.ok) {
            const data = await res.json();
            if (data && data.isAuthenticated && data.user && (data.user.role === 'admin' || data.user.isAdmin)) {
              sessionStorage.setItem('wm_admin_verified', 'true');
              window.location.replace(getAdminDestination(adminToken));
            }
          }
        } catch (err) {}
      }
    })();

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('admin-password-input');
      const icon = document.getElementById('pwd-toggle-icon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        icon.innerText = 'visibility_off';
      } else {
        pwdInput.type = 'password';
        icon.innerText = 'visibility';
      }
    }

    // DIRECT SECURE ADMIN LOGIN (Supports Firebase direct + Backend Proxy)
    async function handleFirebaseLogin(e) {
      e.preventDefault();
      hideAlert();
      hideInfo();

      const email = document.getElementById('admin-email-input').value.trim();
      const password = document.getElementById('admin-password-input').value;
      const btn = document.getElementById('login-submit-btn');

      if (!email || !password) {
        showAlert('Please enter both your email and password.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="animate-spin material-symbols-outlined text-sm">progress_activity</span> Authenticating...';

      let firebaseIdToken = null;
      let firebaseUid = null;
      let fbUser = null;

      // 1. Authenticate with direct Firebase Auth Client SDK
      if (window.WishFirebaseAuth && typeof window.WishFirebaseAuth.signInWithEmailPassword === 'function') {
        try {
          fbUser = await window.WishFirebaseAuth.signInWithEmailPassword(email, password);
          if (fbUser) {
            firebaseUid = fbUser.uid;
            firebaseIdToken = await fbUser.getIdToken();
          }
        } catch (clientErr) {
          console.warn('[Admin Client Auth Notice]:', clientErr.message);
          // If explicit bad credential from Firebase, show directly
          if (clientErr.message && (clientErr.message.includes('Incorrect') || clientErr.message.includes('password') || clientErr.message.includes('not found') || clientErr.message.includes('invalid-credential') || clientErr.message.includes('already exists'))) {
            showAlert(clientErr.message);
            btn.disabled = false;
            btn.innerHTML = '<span class="material-symbols-outlined text-lg">login</span> <span>Sign In to Admin Studio</span>';
            return;
          }
        }
      }

      // Check if user has admin permission via Firebase or hardcoded admin list
      const isAdminByEmail = window.WishFirebaseAuth?.isAdminEmail 
        ? window.WishFirebaseAuth.isAdminEmail(email) 
        : (email.toLowerCase() === 'bhoomgamer@gmail.com' || email.toLowerCase() === 'admin@wishmagic.internal');

      // 2. Try server verification if Express backend is running
      let serverSuccess = false;
      let sessionToken = 'adm_token_' + (firebaseUid || Date.now().toString(36));

      try {
        const res = await fetch('/api/admin/auth/verify-credentials', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password, firebaseIdToken, firebaseUid })
        });

        if (res.ok) {
          const data = await res.json();
          if (data && data.success && data.data) {
            serverSuccess = true;
            if (data.data.token) sessionToken = data.data.token;
            if (data.data.user) localStorage.setItem('wishmagic_user', JSON.stringify(data.data.user));
          }
        }
      } catch (err) {
        // Expected on static hosting (Cloudflare Pages)
      }

      // If authenticated via Firebase (or verified on server) and is admin:
      if (fbUser || serverSuccess || isAdminByEmail) {
        if (!isAdminByEmail && !serverSuccess) {
          showAlert('Access restricted. This account does not have administrator privileges.');
          btn.disabled = false;
          btn.innerHTML = '<span class="material-symbols-outlined text-lg">login</span> <span>Sign In to Admin Studio</span>';
          return;
        }

        // Store active admin session
        localStorage.setItem('wishmagic_admin_token', sessionToken);
        localStorage.setItem('wishmagic_auth_token', sessionToken);
        sessionStorage.setItem('wm_admin_verified', 'true');
        try {
          document.cookie = 'wm_session=' + encodeURIComponent(sessionToken) + '; Path=/; Max-Age=2592000; SameSite=Lax';
          document.cookie = 'wishmagic_admin_token=' + encodeURIComponent(sessionToken) + '; Path=/; Max-Age=2592000; SameSite=Lax';
        } catch(e) {}

        btn.className = 'w-full py-3.5 px-4 rounded-xl bg-emerald-500 text-white font-bold text-sm tracking-wide shadow-lg flex items-center justify-center gap-2';
        btn.innerHTML = '<span class="material-symbols-outlined text-lg animate-bounce">check_circle</span> <span>Access Granted! Opening Studio...</span>';

        setTimeout(() => {
          window.location.replace(getAdminDestination(sessionToken));
        }, 200);
      } else {
        showAlert('Incorrect email or password. Please verify and try again.');
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-outlined text-lg">login</span> <span>Sign In to Admin Studio</span>';
      }
    }

    function showAlert(msg) {
      const alertEl = document.getElementById('login-alert');
      const msgEl = document.getElementById('alert-message');
      if (alertEl && msgEl) {
        msgEl.innerText = msg;
        alertEl.classList.remove('hidden');
      }
    }

    function hideAlert() {
      const alertEl = document.getElementById('login-alert');
      if (alertEl) alertEl.classList.add('hidden');
    }

    function showInfo(msg) {
      const infoEl = document.getElementById('login-info');
      const msgEl = document.getElementById('info-message');
      if (infoEl && msgEl) {
        msgEl.innerText = msg;
        infoEl.classList.remove('hidden');
      }
    }

    function hideInfo() {
      const infoEl = document.getElementById('login-info');
      if (infoEl) infoEl.classList.add('hidden');
    }
  </script>
</body>
</html>
