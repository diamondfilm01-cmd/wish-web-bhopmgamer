<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <base href="/"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Admin Studio Security | WishMagic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  
  <script src="/js/tailwind-config.js"></script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    if (typeof tailwind !== 'undefined' && typeof sharedTailwindConfig !== 'undefined') {
      tailwind.config = sharedTailwindConfig;
    }
  </script>
  <link rel="stylesheet" href="/css/admin-theme.css"/>
  <!-- Firebase Official SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="/js/firebase-auth.js"></script>
  <style>
    body {
      background-color: #07040d !important;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(124, 58, 237, 0.22), transparent 35%),
        radial-gradient(circle at 85% 85%, rgba(236, 72, 153, 0.18), transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(79, 70, 229, 0.1), transparent 50%);
    }
    .glass-card {
      background: rgba(18, 10, 34, 0.88);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(139, 92, 246, 0.3);
      box-shadow: 0 0 70px rgba(0, 0, 0, 0.9), 0 0 30px rgba(124, 58, 237, 0.2);
    }
  </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4 selection:bg-purple-600 selection:text-white relative overflow-x-hidden font-['Plus+Jakarta+Sans',sans-serif]">

  <!-- Ambient Glowing Orbs -->
  <div class="fixed -top-32 -left-32 w-96 h-96 bg-purple-600/20 rounded-full blur-[128px] pointer-events-none animate-pulse"></div>
  <div class="fixed -bottom-32 -right-32 w-96 h-96 bg-pink-600/15 rounded-full blur-[128px] pointer-events-none"></div>

  <!-- Main Security Gate Card -->
  <div class="w-full max-w-md glass-card rounded-3xl p-7 sm:p-9 relative z-10 flex flex-col gap-6 text-center">

    <!-- Header & Shield Icon -->
    <div class="flex flex-col items-center gap-3">
      <div class="relative">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-600 via-indigo-600 to-pink-500 flex items-center justify-center shadow-[0_0_35px_rgba(168,85,247,0.5)] border border-white/20">
          <span class="material-symbols-outlined text-white text-3xl">shield_person</span>
        </div>
        <div class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full bg-pink-500 border-2 border-[#07040d] flex items-center justify-center shadow-lg">
          <span class="material-symbols-outlined text-[12px] text-white font-black">lock</span>
        </div>
      </div>

      <div>
        <h1 class="text-2xl font-extrabold text-white tracking-tight flex items-center justify-center gap-1.5 font-['Outfit',sans-serif]">
          <span>WishMagic</span>
          <span class="bg-gradient-to-r from-purple-400 via-pink-400 to-amber-300 bg-clip-text text-transparent">Admin Studio</span>
        </h1>
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-pink-500/10 border border-pink-500/30 text-pink-300 text-[11px] font-bold mt-2">
          <span>⚡ Protected Master Portal</span>
        </div>
      </div>
    </div>

    <!-- Description & Security Requirement -->
    <div class="bg-purple-950/40 border border-purple-800/60 rounded-2xl p-4 text-left">
      <div class="flex items-start gap-3">
        <span class="material-symbols-outlined text-amber-400 text-xl shrink-0 mt-0.5">verified_user</span>
        <div>
          <h2 class="text-xs font-bold text-white uppercase tracking-wider">Authorized Google Access Only</h2>
          <p class="text-xs text-purple-200/80 mt-1.5 leading-relaxed">
            Yeh Admin Studio password-free hai aur sirf authorized Master Admin Google account ke liye secured hai.
          </p>
        </div>
      </div>
    </div>

    <!-- Status / Error Banner -->
    <div id="gatekeeper-alert" class="hidden p-3.5 rounded-2xl bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs font-medium flex items-center gap-2.5 transition-all text-left">
      <span class="material-symbols-outlined text-base shrink-0 text-rose-400">error</span>
      <span id="alert-message">Access denied.</span>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-col gap-3">
      <!-- 1-Tap Google Sign-In Button -->
      <button type="button" id="google-admin-btn" onclick="handleAdminGoogleLogin()" class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-purple-600 via-indigo-600 to-pink-600 hover:brightness-110 text-white font-bold text-sm tracking-wide shadow-[0_0_30px_rgba(147,51,234,0.4)] flex items-center justify-center gap-3 transition-all cursor-pointer active:scale-98">
        <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
          <path fill="#ffffff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#ffffff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#ffffff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#ffffff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span id="btn-text">Sign In with Admin Google Account</span>
      </button>

      <!-- Return Link -->
      <a href="/" class="w-full py-3 px-4 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-bold text-purple-200 transition-all flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-base">arrow_back</span>
        <span>Return to Main Website</span>
      </a>
    </div>

  </div>

  <script>
  (() => {
    'use strict';

    const ADMIN_TARGET = '/admin/anktech/anktech/admin/overview';
    const MASTER_EMAIL = 'ankit.babusaini@gmail.com';

    let bootFinished = false;
    let navigationInProgress = false;
    let firebaseObserverAttached = false;
    let serverSessionCheckInProgress = false;
    let serverSigninInProgress = false;

    function cleanEmail(value) {
      return String(value || '').trim().toLowerCase();
    }

    function isAuthorizedEmail(email) {
      return cleanEmail(email) === MASTER_EMAIL;
    }

    function getServerUser(data) {
      return data?.data?.user || data?.user || null;
    }

    function isAdminServerUser(user) {
      if (!user) return false;

      const email = cleanEmail(user.email);

      return (
        email === MASTER_EMAIL &&
        (
          user.role === 'admin' ||
          user.role === 'OWNER' ||
          user.role === 'SUPER_ADMIN' ||
          user.isAdmin === true
        )
      );
    }

    function showBootState(message = 'Checking secure admin session...') {
      const btn = document.getElementById('google-admin-btn');
      const txt = document.getElementById('btn-text');

      if (btn) {
        btn.disabled = true;
      }

      if (txt) {
        txt.innerHTML = `
          <span class="inline-flex items-center gap-2">
            <span class="animate-spin inline-block w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full"></span>
            ${message}
          </span>
        `;
      }
    }

    function showLoginState() {
      const btn = document.getElementById('google-admin-btn');
      const txt = document.getElementById('btn-text');

      if (btn) {
        btn.disabled = false;
      }

      if (txt) {
        txt.textContent = 'Sign In with Admin Google Account';
      }
    }

    function showError(message) {
      const alertBox = document.getElementById('gatekeeper-alert');
      const alertMessage = document.getElementById('alert-message');

      if (alertBox) {
        alertBox.classList.remove('hidden');
      }

      if (alertMessage) {
        alertMessage.textContent = message;
      }
    }

    function hideAlert() {
      const alertBox = document.getElementById('gatekeeper-alert');
      if (alertBox) {
        alertBox.classList.add('hidden');
      }
    }

    async function getServerSession() {
      if (serverSessionCheckInProgress) {
        return null;
      }

      serverSessionCheckInProgress = true;

      try {
        const response = await fetch('/api/auth/session', {
          method: 'GET',
          credentials: 'include',
          cache: 'no-store',
          headers: {
            'Accept': 'application/json'
          }
        });

        const data = await response.json().catch(() => ({}));
        const user = getServerUser(data);

        if (
          response.ok &&
          data?.success === true &&
          data?.isAuthenticated === true &&
          isAdminServerUser(user)
        ) {
          return user;
        }

        return null;
      } catch (error) {
        console.warn('[AdminAuth] Server session check failed:', error);
        return null;
      } finally {
        serverSessionCheckInProgress = false;
      }
    }

    async function createServerSession(firebaseUser) {
      if (!firebaseUser) {
        throw new Error('Google authentication did not return a user.');
      }

      const email = cleanEmail(firebaseUser.email);

      if (!isAuthorizedEmail(email)) {
        throw new Error(
          'Access Denied: This Google account is not authorized for Admin Studio.'
        );
      }

      if (serverSigninInProgress) {
        throw new Error('Admin session creation is already in progress.');
      }

      serverSigninInProgress = true;

      try {
        const response = await fetch('/api/auth/signin', {
          method: 'POST',
          credentials: 'include',
          cache: 'no-store',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            email: email,
            displayName: firebaseUser.displayName || 'Ankit Saini',
            avatarUrl: firebaseUser.photoURL || null,
            provider: 'google',
            firebaseUid: firebaseUser.uid
          })
        });

        const data = await response.json().catch(() => ({}));
        const user = getServerUser(data);

        if (
          !response.ok ||
          data?.success !== true ||
          !isAdminServerUser(user)
        ) {
          const message =
            data?.error?.message ||
            data?.message ||
            'Secure Admin server session could not be established.';

          throw new Error(message);
        }

        /*
         * IMPORTANT:
         * Do a SECOND server verification.
         *
         * Never assume that POST /signin automatically means
         * the browser actually has a valid authenticated session.
         */
        const verifiedUser = await getServerSession();

        if (!verifiedUser) {
          throw new Error(
            'Admin login succeeded but server session verification failed.'
          );
        }

        return verifiedUser;

      } finally {
        serverSigninInProgress = false;
      }
    }

    async function navigateToAdmin() {
      if (navigationInProgress) {
        return;
      }

      navigationInProgress = true;

      showBootState('Authorized! Opening Admin Studio...');

      /*
       * Use replace only once.
       */
      window.location.replace(ADMIN_TARGET);
    }

    async function bootstrapAdminLogin() {
      if (bootFinished) {
        return;
      }

      bootFinished = true;

      showBootState('Checking secure admin session...');

      /*
       * STEP 1:
       * Existing server session has priority.
       */
      const existingSession = await getServerSession();

      if (existingSession) {
        await navigateToAdmin();
        return;
      }

      /*
       * STEP 2:
       * Wait for Firebase initialization.
       *
       * Do not assume currentUser === null means logged out
       * until Firebase Auth has finished initialization.
       */
      if (
        window.WishFirebaseAuth &&
        typeof window.WishFirebaseAuth.onAuthStateChanged === 'function'
      ) {
        if (!firebaseObserverAttached) {
          firebaseObserverAttached = true;

          let handled = false;

          window.WishFirebaseAuth.onAuthStateChanged(async (firebaseUser) => {

            if (handled) {
              return;
            }

            /*
             * Firebase may initially report null.
             * If null, show the login UI.
             */
            if (!firebaseUser) {
              handled = true;
              showLoginState();
              return;
            }

            const email = cleanEmail(firebaseUser.email);

            if (!isAuthorizedEmail(email)) {
              handled = true;

              try {
                await window.WishFirebaseAuth.signOut();
              } catch (_) {}

              showLoginState();

              showError(
                'Access Denied: This Google account is not authorized for Admin Studio.'
              );

              return;
            }

            try {
              showBootState('Authorized Google session detected...');

              /*
               * Create/refresh the real server session.
               */
              await createServerSession(firebaseUser);

              handled = true;

              await navigateToAdmin();

            } catch (error) {
              handled = true;

              console.error('[AdminAuth] Existing Firebase session sync failed:', error);

              showLoginState();

              showError(
                error?.message ||
                'Could not establish the secure Admin session.'
              );
            }
          });
        }

        return;
      }

      showLoginState();

      showError(
        'Authentication system is still initializing. Please try again.'
      );
    }

    window.handleAdminGoogleLogin = async function () {
      if (navigationInProgress || serverSigninInProgress) {
        return;
      }

      hideAlert();

      const btn = document.getElementById('google-admin-btn');
      const txt = document.getElementById('btn-text');

      if (!window.WishFirebaseAuth) {
        showError('Authentication system is still initializing. Please try again.');
        return;
      }

      if (btn) {
        btn.disabled = true;
      }

      if (txt) {
        txt.innerHTML = `
          <span class="inline-flex items-center gap-2">
            <span class="animate-spin inline-block w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full"></span>
            Connecting to Google...
          </span>
        `;
      }

      try {
        const firebaseUser =
          await window.WishFirebaseAuth.signInWithGoogle();

        if (!firebaseUser) {
          throw new Error('Google Sign-In was cancelled.');
        }

        const email = cleanEmail(firebaseUser.email);

        if (!isAuthorizedEmail(email)) {
          try {
            await window.WishFirebaseAuth.signOut();
          } catch (_) {}

          throw new Error(
            'Access Denied: This Google account is not authorized for Admin Studio.'
          );
        }

        if (txt) {
          txt.textContent = 'Verifying secure Admin session...';
        }

        /*
         * CRITICAL:
         * Wait for server response.
         * Wait for second server verification.
         * Only then navigate.
         */
        await createServerSession(firebaseUser);

        await navigateToAdmin();

      } catch (error) {
        console.error('[AdminAuth] Google login failed:', error);

        showError(
          error?.message ||
          'Authentication failed. Please try again.'
        );

        showLoginState();
      }
    };

    /*
     * Start exactly ONE bootstrap process.
     */
    if (document.readyState === 'loading') {
      document.addEventListener(
        'DOMContentLoaded',
        bootstrapAdminLogin,
        { once: true }
      );
    } else {
      bootstrapAdminLogin();
    }

  })();
</script>
</body>
</html>
